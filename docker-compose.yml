version: '3.9'
services:
  lojaweb:
    image: python:3.11-slim
    container_name: lojaweb
    working_dir: /app
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python app.py"
    volumes:
      - ./:/app
      - lojaweb_data:/app/instance
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped
    environment:
      DEFAULT_ADMIN_PASSWORD: "${DEFAULT_ADMIN_PASSWORD:?Defina a senha inicial no ambiente}"
      SECRET_KEY: "${SECRET_KEY:?Defina uma chave de sessão no ambiente}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_DEFAULT_SENDER: "${MAIL_DEFAULT_SENDER:-}"

volumes:
  lojaweb_data:
